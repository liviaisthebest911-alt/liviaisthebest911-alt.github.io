<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="theme-color" content="#fff6f8" />
    <title>{{ page.title }} · {{ site.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/css/effects.css' | relative_url }}" />

    <!-- KaTeX -->
    {% if page.math %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71bZlFzdi8" crossorigin="anonymous">
    {% endif %}
</head>
<body>
<!-- Boot Screen -->
<div id="boot-screen" aria-hidden="true">
    <div class="boot-text">Loading system...</div>
</div>

<!-- Background Canvas & Mouse Glow -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div id="mouse-glow" aria-hidden="true"></div>

<a class="skip-link" href="#main">Bỏ qua đến nội dung chính</a>

<header class="site-header">
    <nav class="navbar section-shell" aria-label="Điều hướng chính">
        <a href="{{ '/index.html' | relative_url }}" class="brand" aria-label="Trang chủ">
            <span class="brand-mark" aria-hidden="true">OJ</span>
            <span class="brand-text decode-trigger">Olive June Math</span>
        </a>

        <div class="nav-links" id="navLinks">
            <a href="{{ '/about.html' | relative_url }}">Giới thiệu</a>
            <a href="{{ '/skills.html' | relative_url }}">Kỹ năng</a>
            <a href="{{ '/projects.html' | relative_url }}">Dự án</a>
            <a href="{{ '/blog.html' | relative_url }}" aria-current="page">Blog</a>
            <a href="{{ '/contact.html' | relative_url }}">Liên hệ</a>
            <a href="{{ '/cv.html' | relative_url }}" class="btn-nav-cta">Xem CV</a>
        </div>

        <div class="nav-controls">
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Chuyển chế độ sáng / tối">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button id="fxToggle" class="theme-toggle" type="button" aria-label="Bật/tắt hiệu ứng nền">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            </button>
            <button class="nav-toggle" id="navToggle" aria-label="Mở menu" aria-expanded="false" aria-controls="navLinks">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
</header>

<main id="main">
    {{ content }}
</main>

<footer class="site-footer">
    <div class="section-shell footer-inner">
        <p class="footer-mono">Được xây dựng bằng HTML · CSS · JS · Jekyll</p>
        <p class="footer-mono">© <span id="footerYear"></span> {{ site.title }} | VNU-HUS</p>
    </div>
</footer>

{% if page.math %}
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
{% endif %}

<script type="module" src="{{ '/js/main.js' | relative_url }}"></script>
</body>
</html>
