---
layout: default
---
<!-- Canvas vẽ đường sin tiến độ -->
<canvas id="reading-progress-canvas" aria-hidden="true"></canvas>

<article class="post-container section-shell content-section" style="max-width: 760px;">
    <a href="{{ '/blog.html' | relative_url }}" class="btn btn-ghost btn-sm back-link">← Về trang Blog</a>

    <header class="post-header fade-in">
        <p class="section-kicker">Blog</p>
        <h1 class="decode-trigger" data-decode-once="true">{{ page.title }}</h1>

        <div class="post-meta">
            <time class="commit-date" datetime="{{ page.date | date_to_xmlschema }}">
                {{ page.date | date: "%Y-%m-%d" }}
            </time>
            <div class="post-tags">
                {% for tag in page.tags %}
                <span>{ {{ tag }} }</span>
                {% endendfor %}
            </div>
        </div>
    </header>

    <div class="post-content fade-in">
        {{ content }}
    </div>

    <a href="{{ '/blog.html' | relative_url }}" class="btn btn-ghost back-link-bottom">← Về trang Blog</a>
</article>
