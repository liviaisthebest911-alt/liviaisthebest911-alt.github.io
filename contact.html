<main id="main">
    <section class="content-section contact-section" aria-labelledby="contact-heading">
        <div class="section-shell">
            <div class="section-heading fade-in">
                <p class="section-kicker">Liên hệ</p>
                <h2 id="contact-heading">Kết nối<br />với tôi</h2>
            </div>

            <div class="contact-grid">
                <form class="contact-form fade-in" id="contactForm" novalidate>
                    <div class="form-row">
                        <label for="cName">Họ tên</label>
                        <input type="text" id="cName" name="name" required autocomplete="name" placeholder="Nguyễn Văn A" />
                    </div>
                    <div class="form-row">
                        <label for="cEmail">Email</label>
                        <input type="email" id="cEmail" name="email" required autocomplete="email" placeholder="ban@vidu.com" />
                    </div>
                    <div class="form-row">
                        <label for="cMessage">Nội dung</label>
                        <textarea id="cMessage" name="message" rows="4" required placeholder="Xin chào Olive, mình muốn..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Gửi tin nhắn</button>
                    <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
                </form>

                <div class="contact-side fade-in">
                    <div class="email-card">
                        <span class="email-label">Địa chỉ email</span>
                        <a href="mailto:olive.june.math@example.com" id="emailLink">olive.june.math@example.com</a>
                        <button class="copy-button" id="copyBtn" aria-label="Sao chép địa chỉ email">Sao chép</button>
                    </div>

                    <nav class="social-links" aria-label="Mạng xã hội">

                            GitHub
                        </a>
